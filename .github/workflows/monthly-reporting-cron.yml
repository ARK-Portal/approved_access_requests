# This workflow runs on the 2nd day of each month to execute 
# utils/scrape_approved_access_page.R and update approved_requests.monthly_report.log
# then commit updates to the repo

name: monthly-reporting-cron

on:
  schedule:
    - cron: '0 0 2 * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'The commit message to use'
        required: true
        default: 'Manual update via workflow_dispatch'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.
      # Set up supported python.
      - name: Setup R env
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: '4.3.3'

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::stringr
            any::ggplot2
            any::lubridate
            any::glue
            any::chromote
            any::rvest
            any::purrr
            any::tidyr
            any::forcats
            any::pals

      - name: Run monthly report script
        run: |
          Rscript utils/scrape_approved_access_page.R

      - name: Commit files if there are changes
        run: |
          git status
          if [[ $(git status -z) ]]; then 
            echo "New monthly report will be committed"
            git config --local user.name "$GITHUB_ACTOR"
            git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
            git add -A
            git commit -m "${{ github.event.inputs.commit_message || 'commit results of monthly-reporting-cron workflow' }}"
          else 
            echo "No changes identified. Nothing to commit."
          fi
    
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
         github_token: ${{ secrets.GITHUB_TOKEN }}
         branch: ${{ github.event.pull_request.head.ref }} #The name of the branch being merged into main
         force: true
